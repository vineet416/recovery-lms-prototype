{% extends "base.html" %}
{% block content %}
<h2>Login</h2>
<form method="post" action="/login">
  <label>Username
    <input type="text" name="username" required autofocus>
  </label>
  <label>Password
    <input type="password" name="password" required>
  </label>
  <button type="submit">Login</button>
</form>
{% endblock %}
